name: Test
on:
  # push:
  #   paths:
  #     - .github/workflows/test.yml
  #     - action.yml
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: ./

    - name: Keep alive
      shell: bash
      run: sleep 5m
